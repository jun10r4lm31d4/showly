apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: 'dagger.hilt.android.plugin'
apply from: '../versions.gradle'

// Version fields come from :app (git-semver plugin); this guarantees :app
// is configured first regardless of settings.gradle order.
evaluationDependsOn(':app')

android {
  kotlinOptions { jvmTarget = "21" }
  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }

  compileSdkVersion versions.compileSdk

  buildFeatures {
    buildConfig = true
  }

  defaultConfig {
    minSdkVersion versions.minSdk
      compileSdkVersion versions.compileSdk

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    consumerProguardFiles "consumer-rules.pro"
  }

  buildTypes.all {
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())

    buildConfigField("String", "TRAKT_CLIENT_ID", properties.getProperty("traktClientId"))
    buildConfigField("String", "TMDB_API_KEY", properties.getProperty("tmdbApiKey"))
    buildConfigField("String", "OMDB_API_KEY", properties.getProperty("omdbApiKey"))
    buildConfigField("String", "SCROB_API_KEY", "\"\"")
    buildConfigField("String", "SCROB_URL", "\"\"")
    // Computed in :app from the git-semver plugin (see evaluationDependsOn above).
    buildConfigField("String", "VER_NAME", "\"${rootProject.ext.appVersionName}\"")
    buildConfigField("int", "VER_CODE", "${rootProject.ext.appVersionCode}")
  }

  buildTypes {
    debug {
      Properties properties = new Properties()
      properties.load(project.rootProject.file('local.properties').newDataInputStream())

      buildConfigField("String", "SCROB_API_KEY", properties.getProperty("scrobApiKey"))
      buildConfigField("String", "SCROB_URL", properties.getProperty("scrobUrl"))

      minifyEnabled false
    }

    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }
  }

  namespace 'com.michaldrabik.data_remote'
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
}

dependencies {
  implementation project(':common')

  api libs.retrofit
  api libs.retrofit.moshi
  api libs.loggingInterceptor

  implementation libs.moshi
  implementation libs.coroutines
  implementation libs.timber

  implementation libs.hilt.android
  ksp libs.hilt.compiler

  testImplementation libs.junit

  coreLibraryDesugaring libs.android.desugar
}
