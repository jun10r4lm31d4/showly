plugins {
  id 'com.android.application'
  id 'kotlin-android'
  id 'com.google.devtools.ksp'
  id 'dagger.hilt.android.plugin'
  id 'com.github.jmongard.git-semver-plugin'
}

apply from: '../versions.gradle'

// Single source of truth for the app version: derived from the git-semver
// plugin (e.g. 3.59.0-SNAPSHOT). Libraries read these via rootProject.ext.
def appVersionName = semver.version
def appVersionCode = semver.versionValue.with { major * 1000000 + minor * 1000 + patch }
rootProject.ext.appVersionName = appVersionName
rootProject.ext.appVersionCode = appVersionCode

android {
  kotlinOptions { jvmTarget = "21" }
  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }

  buildFeatures {
    buildConfig = true
    viewBinding true
  }

  hilt {
    enableExperimentalClasspathAggregation = true
  }

  compileSdkVersion versions.compileSdk

  defaultConfig {
    applicationId "io.github.jun10r4lm31d4.showly2"
    versionCode appVersionCode
    versionName appVersionName
    minSdkVersion versions.minSdk
    targetSdkVersion versions.targetSdk
    compileSdkVersion versions.compileSdk
    compileSdkVersion versions.compileSdk

    resourceConfigurations += ['en', 'ar', 'de', 'da', 'es', 'fi', 'fr', 'it', 'pl', 'pt', 'ro', 'ru', 'tr', 'zh', 'uk']
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  signingConfigs {
    def keystorePropertiesFile = rootProject.file("app/keystore.properties")
    def keystoreProperties = new Properties()
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

    release {
      storeFile file("keystore")
      storePassword keystoreProperties['storePassword']
      keyAlias keystoreProperties['keyAlias']
      keyPassword keystoreProperties['keyPassword']
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix '.debugoss'
      versionNameSuffix '-debug'
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      manifestPlaceholders = [
          appIcon     : "@mipmap/ic_launcher_gray",
          appIconRound: "@mipmap/ic_launcher_round_gray"
      ]
    }
    release {
      minifyEnabled true
      signingConfig signingConfigs.release
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      manifestPlaceholders = [
          appIcon     : "@mipmap/ic_launcher",
          appIconRound: "@mipmap/ic_launcher_round"
      ]
    }
  }

  lint {
    checkReleaseBuilds false
  }

  // https://github.com/michaldrabik/showly-2.0/issues/46#issuecomment-2324619155
  dependenciesInfo {
    // Disables dependency metadata when building APKs.
    includeInApk = false
    // Disables dependency metadata when building Android App Bundles.
    includeInBundle = false
  }

  namespace 'com.michaldrabik.showly2'
}

dependencies {
  implementation project(':common')
  implementation project(':data-remote')
  implementation project(':data-local')
  implementation project(':repository')
  implementation project(':ui-base')
  implementation project(':ui-backup')
  implementation project(':ui-model')
  implementation project(':ui-navigation')
  implementation project(':ui-discover')
  implementation project(':ui-discover-movies')
  implementation project(':ui-episodes')
  implementation project(':ui-comments')
  implementation project(':ui-lists')
  implementation project(':ui-show')
  implementation project(':ui-movie')
  implementation project(':ui-gallery')
  implementation project(':ui-my-shows')
  implementation project(':ui-my-movies')
  implementation project(':ui-search')
  implementation project(':ui-statistics')
  implementation project(':ui-statistics-movies')
  implementation project(':ui-settings')
  implementation project(':ui-progress')
  implementation project(':ui-progress-movies')
  implementation project(':ui-widgets')

  implementation libs.hilt.android
  ksp libs.hilt.compiler
  implementation libs.hilt.work
  ksp libs.hilt.work.compiler

  testImplementation libs.bundles.testing
  androidTestImplementation libs.android.test.runner

  //  debugImplementation "com.squareup.leakcanary:leakcanary-android:$versions.leakCanary"
  coreLibraryDesugaring libs.android.desugar
}

semver {
    defaultPreRelease = "SNAPSHOT"

    releasePattern = "\\Arelease(?:\\([^()]+\\))?:"

    majorPattern = "\\A\\w+(?:\\([^()]+\\))?!:|^BREAKING[ -]CHANGE:"
    minorPattern = "\\Afeat(?:\\([^()]+\\))?:"
    patchPattern = "\\Afix(?:\\([^()]+\\))?:"

    releaseCommitTextFormat = "release: %s\n\n%s"

    // Suas tags são 3.58.1, não v3.58.1
    releaseTagNameFormat = "%s"

    groupVersionIncrements = true
    noDirtyCheck = false
    noAutoBump = false

    gitDirectory = project.projectDir

    createReleaseCommit = true
    createReleaseTag = true
}

version = semver.version
