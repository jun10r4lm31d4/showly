apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'dagger.hilt.android.plugin'
apply from: '../versions.gradle'

// Version fields come from :app (git-semver plugin); this guarantees :app
// is configured first regardless of settings.gradle order.
evaluationDependsOn(':app')

android {
  kotlinOptions { jvmTarget = "21" }
  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }

  buildFeatures {
    buildConfig = true
  }

  buildFeatures {
    viewBinding true
  }

  compileSdkVersion versions.compileSdk

  defaultConfig {
    minSdkVersion versions.minSdk
      compileSdkVersion versions.compileSdk

    // Computed in :app from the git-semver plugin (see evaluationDependsOn above).
    buildConfigField 'int', 'VER_CODE', "${rootProject.ext.appVersionCode}"
    buildConfigField 'String', 'VER_NAME', "\"${rootProject.ext.appVersionName}\""

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  namespace 'com.michaldrabik.ui_settings'
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
}

dependencies {
  implementation project(':common')
  implementation project(':data-local')
  implementation project(':data-remote')
  implementation project(':repository')
  implementation project(':ui-base')
  implementation project(':ui-backup')
  implementation project(':ui-model')
  implementation project(':ui-navigation')

  implementation libs.hilt.android
  ksp libs.hilt.compiler

  api libs.phoenix

  coreLibraryDesugaring libs.android.desugar
}
